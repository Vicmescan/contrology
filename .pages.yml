# Configuración de Pages CMS (https://pagescms.org): el panel donde se escriben las entradas.
media:
  input: public/images
  output: /contrology/images

content:
  - name: blog
    label: Journal
    type: collection
    path: src/content/blog
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date, draft]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Summary
        type: text
        description: Short text shown in the list of entries and on Google.
      - name: cover
        label: Cover image
        type: image
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: While checked, the entry is not published.
      - name: body
        label: Content
        type: rich-text
